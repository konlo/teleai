name: Agent release gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-runtime-import-and-lock:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      TELLY_DATA_BACKEND: databricks
      DATABRICKS_HOST: example.invalid
      DATABRICKS_HTTP_PATH: /sql/fixture
      DATABRICKS_TOKEN: fixture-no-network
      DATABRICKS_CATALOG: eval_catalog
      DATABRICKS_SCHEMA: lab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Import the agent on Windows without fcntl
        run: python -c "from core.analysis_agent.runtime import GraphAnalysisRuntime"
      - name: Check native Windows contention and release
        run: python -m unittest tests.test_file_lock
      - name: Render initial Databricks page without executing SQL
        run: python -c "from streamlit.testing.v1 import AppTest; app = AppTest.from_file('main.py', default_timeout=30).run(); assert not app.exception; assert app.chat_input; runtime = app.session_state['v1_runtime']; assert runtime.context.sql_dialect == 'databricks'; runtime.close()"
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONWARNINGS: ignore
      # UI contracts mock remote execution; do not depend on a developer's .env.
      TELLY_DATA_BACKEND: databricks
      DATABRICKS_HOST: example.invalid
      DATABRICKS_HTTP_PATH: /sql/fixture
      DATABRICKS_TOKEN: fixture-no-network
      DATABRICKS_CATALOG: eval_catalog
      DATABRICKS_SCHEMA: lab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-agent.txt
      - name: Install pinned agent environment
        run: python -m pip install --requirement requirements-agent.txt
      - name: Run migration contracts
        run: python -m unittest discover -s migration -p 'test_*.py'
      - name: Run application tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run agentic recovery contracts
        run: python test_set/run_test_set.py --level 3 --quiet
      - name: Run reference and agentic suite
        run: python test_set/run_test_set.py --all --quiet
      - name: Compile production and validation code
        run: python -m compileall -q core migration scripts tests test_set ui utils
